# Build on every push to main and deploy dist/ to the IONOS webspace over FTPS
# (docs/phases/PHASE-8-seo-deploy.md, items 15–17).
#
# Targets
#   push to main        → staging directory (IONOS_STAGING_DIR)
#   workflow_dispatch   → staging or production (choose `target`); production
#                         only after the client's sign-off
#
# Repository secrets (Settings → Secrets and variables → Actions):
#   IONOS_HOST          FTPS host from the IONOS control panel, e.g. access123456789.webspace-data.io
#   IONOS_USER          FTP user
#   IONOS_PASSWORD      FTP password
#   IONOS_STAGING_DIR   remote directory for staging, e.g. /staging/ (must exist, trailing slash)
#   IONOS_REMOTE_DIR    remote directory for production, e.g. / or /kplus/
#
# Until the secrets exist the deploy job builds and then skips the upload
# (a missing host is reported, not failed), so the workflow stays green.
# The upload never deletes files it did not put there (dangerous-clean-slate
# is off) – the hero video, which is not in the repository, is uploaded to
# public/video/ on the server once by hand (docs/ASSETS.md).

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Deployment target
        type: choice
        required: true
        default: staging
        options:
          - staging
          - production

concurrency:
  group: deploy-${{ github.event.inputs.target || 'staging' }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target || 'staging' }}
    env:
      TARGET: ${{ github.event.inputs.target || 'staging' }}
      IONOS_HOST: ${{ secrets.IONOS_HOST }}
      IONOS_USER: ${{ secrets.IONOS_USER }}
      IONOS_PASSWORD: ${{ secrets.IONOS_PASSWORD }}
      IONOS_STAGING_DIR: ${{ secrets.IONOS_STAGING_DIR }}
      IONOS_REMOTE_DIR: ${{ secrets.IONOS_REMOTE_DIR }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run check

      - run: npm run build

      - name: Resolve remote directory
        id: remote
        run: |
          if [ "$TARGET" = "production" ]; then dir="$IONOS_REMOTE_DIR"; else dir="$IONOS_STAGING_DIR"; fi
          if [ -z "$IONOS_HOST" ] || [ -z "$dir" ]; then
            echo "::notice::IONOS secrets not set – build only, upload skipped ($TARGET)"
            echo "upload=false" >> "$GITHUB_OUTPUT"
          else
            echo "upload=true" >> "$GITHUB_OUTPUT"
            echo "dir=$dir" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload dist/ to IONOS (${{ env.TARGET }})
        if: steps.remote.outputs.upload == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ env.IONOS_HOST }}
          username: ${{ env.IONOS_USER }}
          password: ${{ env.IONOS_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ${{ steps.remote.outputs.dir }}
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
